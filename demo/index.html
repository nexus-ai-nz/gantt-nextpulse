<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gantt Nextpulse</title>
<style>
:root{--bg:#101823;--surface:#182433;--border:#2C3541;--text:#fff;--muted:#8fa0b5;--primary:#00a4ff;--accent:#ff43bd;--done:#2ecc8f;--todo:#6b7a90}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px}
h1{margin:0 0 4px;font-size:26px}
.sub{color:var(--muted);margin-bottom:16px}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 16px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--muted);font-size:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,button{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font:inherit}
.chart{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow-x:auto}
.grid{display:grid;grid-template-columns:260px 1fr;min-width:900px}
.hdr{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);z-index:2}
.months{position:relative;height:34px}
.m{position:absolute;top:0;bottom:0;border-left:1px solid var(--border);padding:8px 6px;font-size:12px;color:var(--muted);white-space:nowrap}
.lbl{padding:10px 14px;border-bottom:1px solid var(--border);height:52px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.lbl .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.lbl .a{color:var(--muted);font-size:12px}
.row{position:relative;height:52px;border-bottom:1px solid var(--border)}
.track{position:absolute;inset:0}
.vline{position:absolute;top:0;bottom:0;border-left:1px solid var(--border);opacity:.5}
.task{position:absolute;top:12px;height:28px;border-radius:7px;background:var(--todo);display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap;cursor:default}
.task .p{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.28)}
.task span{position:relative}
.s-Done{background:var(--done)}.s-InProgress{background:var(--primary)}
.unsched{background:repeating-linear-gradient(45deg,var(--todo),var(--todo) 6px,#55647a 6px,#55647a 12px);border:1px dashed var(--muted)}
.today{position:absolute;top:0;bottom:0;border-left:2px solid var(--accent);z-index:1}
.today::after{content:"Today";position:absolute;top:2px;left:4px;font-size:11px;color:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
#tip{position:fixed;pointer-events:none;background:#0b121b;border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;display:none;z-index:9;max-width:260px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Gantt Nextpulse</h1>
  <div class="sub" id="sub"></div>
  <div class="bar" id="stats"></div>
  <div class="controls">
    <select id="fAssignee"><option value="">All assignees</option></select>
    <select id="fLabel"><option value="">All labels</option></select>
    <select id="fStatus"><option value="">All statuses</option><option>To Do</option><option>In Progress</option><option>Done</option></select>
  </div>
  <div class="chart"><div class="grid" id="grid"></div></div>
  <div class="legend">
    <span><i style="background:var(--done)"></i>Done</span>
    <span><i style="background:var(--primary)"></i>In progress</span>
    <span><i style="background:var(--todo)"></i>To do</span>
    <span><i class="unsched" style="background:repeating-linear-gradient(45deg,#6b7a90,#6b7a90 4px,#55647a 4px,#55647a 8px)"></i>No due date (shown as 14 days from creation)</span>
  </div>
</div>
<div id="tip"></div>
<script>
const DAY=864e5, DEFAULT_SPAN=14;
const d=s=>new Date(s+"T00:00:00Z").getTime();
const fmt=t=>new Date(t).toLocaleDateString("en-NZ",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});
let data=[];
fetch("data/tasks.json").then(r=>r.json()).then(j=>{
  document.getElementById("sub").textContent="Source: Nextpulse ERP database · snapshot "+j.generated+" · no subtasks";
  data=j.tasks.map(t=>({...t,start:d(t.created_at),end:t.due_date?d(t.due_date):d(t.created_at)+DEFAULT_SPAN*DAY,unsched:!t.due_date}));
  for(const [id,key] of [["fAssignee","assignee"],["fLabel","label"]]){
    const el=document.getElementById(id);
    [...new Set(data.map(t=>t[key]))].sort().forEach(v=>el.add(new Option(v,v)));
    el.onchange=render;
  }
  document.getElementById("fStatus").onchange=render;
  render();
});
function render(){
  const a=fAssignee.value,l=fLabel.value,s=fStatus.value;
  const rows=data.filter(t=>(!a||t.assignee===a)&&(!l||t.label===l)&&(!s||t.status===s)).sort((x,y)=>x.start-y.start);
  const today=Date.now();
  const all=rows.length?rows:data;
  const min=Math.min(...all.map(t=>t.start),today)-7*DAY;
  const max=Math.max(...all.map(t=>t.end),today)+14*DAY;
  const span=max-min, pct=t=>((t-min)/span*100);
  const sc=document.getElementById("stats");
  const done=data.filter(t=>t.status==="Done").length, prog=data.filter(t=>t.status==="In Progress").length;
  sc.innerHTML=[[data.length,"Tasks"],[done,"Done"],[prog,"In progress"],[data.filter(t=>t.unsched).length,"No due date"]]
    .map(([n,t])=>`<div class="stat"><b>${n}</b><span>${t}</span></div>`).join("");
  // month ticks
  let months="",cur=new Date(min);cur=Date.UTC(cur.getUTCFullYear(),cur.getUTCMonth()+1,1);
  const first=new Date(min);
  months+=`<div class="m" style="left:0">${first.toLocaleDateString("en-NZ",{month:"short",year:"numeric",timeZone:"UTC"})}</div>`;
  let lines="";
  while(cur<max){
    months+=`<div class="m" style="left:${pct(cur)}%">${new Date(cur).toLocaleDateString("en-NZ",{month:"short",year:"numeric",timeZone:"UTC"})}</div>`;
    lines+=`<div class="vline" style="left:${pct(cur)}%"></div>`;
    const n=new Date(cur);cur=Date.UTC(n.getUTCFullYear(),n.getUTCMonth()+1,1);
  }
  const todayLine=today>=min&&today<=max?`<div class="today" style="left:${pct(today)}%"></div>`:"";
  let html=`<div class="hdr lbl" style="height:34px;padding:8px 14px;font-weight:600;color:#8fa0b5">Task</div><div class="hdr"><div class="months">${months}</div></div>`;
  for(const t of rows){
    const cls=t.unsched?"unsched":"s-"+t.status.replace(/\s/g,"");
    const w=Math.max(pct(t.end)-pct(t.start),1.2);
    html+=`<div class="lbl"><div class="n" title="${t.name}">${t.name}</div><div class="a">${t.assignee} · ${t.label}</div></div>
    <div class="row"><div class="track">${lines}${todayLine}
      <div class="task ${cls}" data-id="${t.id}" style="left:${pct(t.start)}%;width:${w}%"><div class="p" style="width:${t.progress}%"></div><span>${t.progress}%</span></div>
    </div></div>`;
  }
  if(!rows.length)html+=`<div class="lbl">No tasks match</div><div class="row"></div>`;
  grid.innerHTML=html;
  const tip=document.getElementById("tip");
  grid.querySelectorAll(".task").forEach(el=>{
    const t=data.find(x=>x.id==el.dataset.id);
    el.onmousemove=e=>{tip.style.display="block";tip.style.left=e.clientX+12+"px";tip.style.top=e.clientY+12+"px";
      tip.innerHTML=`<b>${t.name}</b><br>${t.status} · priority ${t.priority}<br>${fmt(t.start)} → ${t.unsched?"no due date":fmt(t.end)}<br>${t.assignee}`};
    el.onmouseleave=()=>tip.style.display="none";
  });
}
</script>
</body>
</html>
